# 心镜平台 Nginx 配置（文档 9.1 部署方案）
# 笔记本 + DDNS + Nginx 反向代理；生产环境由 Nginx 托管 HTTPS 并转发至 Gunicorn。

upstream mind_mirror {
    server 127.0.0.1:8000;
    keepalive 16;
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN_OR_DDNS_HOST;

    # Let's Encrypt 证书（certbot 自动续期）
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN_OR_DDNS_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_OR_DDNS_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 请求体上限（量表作答为 JSON，足够）
    client_max_body_size 2m;

    location / {
        proxy_pass http://mind_mirror;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 静态资源长缓存（前端文件由 Flask 托管，命中后缓存）
    location ~* \.(css|js|png|jpg|svg|ico)$ {
        proxy_pass http://mind_mirror;
        expires 7d;
    }
}
